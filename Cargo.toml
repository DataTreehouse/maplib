[workspace]
resolver = "2"
members = [
    "lib/in_memory",
    "lib/disk",
    "lib/utils",
    "lib/representation",
    "lib/maplib",
    "lib/triplestore",
    "lib/file_io",
    "lib/query_processing",
    "lib/spargebra",
    "lib/shacl",
    "lib/fts",
    "lib/datalog",
    "lib/cimxml_export",
    "lib/cimxml_import",
    "lib/chrontext",
    "lib/virtualized_query",
    "lib/virtualization",
    "lib/opc_ua",
    "lib/external_sparql",
    "py_maplib",
]

[workspace.package]
rust-version = "1.88.0"
edition = "2021"

[workspace.dependencies]
pyo3 = { version = "0.29.0", features = ["py-clone", "rust_decimal"] }
#Moment is there to work around a feature toggle bug
polars = { version = "0.55.1", features = [
    "simd",
    "nightly",
    "performant",
    "cse",
    "fmt",
    "parquet",
    "moment",
    "timezones",
    "lazy",
] }
polars-arrow = { version = "0.55.1" }
polars-core = { version = "0.55.1" }
rayon = "1.12.0"
regex = "1.13.1"
oxrdf = { version = "0.3.3" }
oxrdfio = { version = "0.2.5" }
oxttl = { version = "0.2.3" }
oxjsonld = { version = "0.2.5" }
oxiri = "0.2.11"
sparesults = "0.3.3"
oxsdatatypes = "0.2.2"
chrono = "0.4.41"
chrono-tz = "0.10.3"
uuid = { version = "1.16.0", features = [
    "v4", # Lets you generate random UUIDs
    "v5",
    "fast-rng", # Use a faster (but still sufficiently random) RNG
] }
thiserror = "2.0.12"
peg = "0.8"
rand = "0.10.1"
oxilangtag = "0.1.5"
fundu = "2.0.1"
hdt = { version = "0.7.2", default-features = false, features = ["nt"] }
memmap2 = "0.9.5"
sprs = "0.11.3"
walkdir = "2.5.0"
aho-corasick = "1.1.4"
simd-json = { version = "0.18.1", features = ["serde_json"] }
serde_json = { version = "1.0.149" }
serde = { version = "1.0.228" }
urlencoding = "2.1.3"
md-5 = "0.11.0"
sha1 = "0.11.0"
hex = "0.4.3"
memchr = "2.8.0"
quick-xml = { version = "0.41.0", features = ["arbitrary"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-log = "0.2"
itoa = "1.0.15"
ryu = "1.0.20"
nohash-hasher = "0.2.0"
arrow = "58"
ordered-float = "5.1.0"
rust_decimal = "1.42.1"
range-set-blaze = "0.8.0"
reqwest = { version = "0.13.5", features = ["query", "json", "rustls-no-provider"] }
tokio = { version = "1.54.1" }

[patch.crates-io]
polars = { git = 'https://github.com/pola-rs/polars', rev = "7f902bd3ffd27ff82d14278a09a295ff2f7aed92" }
polars-core = { git = 'https://github.com/pola-rs/polars', rev = "7f902bd3ffd27ff82d14278a09a295ff2f7aed92" }
polars-arrow = { git = 'https://github.com/pola-rs/polars', rev = "7f902bd3ffd27ff82d14278a09a295ff2f7aed92" }
# Neded to get polars patched working, https://github.com/rust-lang/hashbrown/pull/727
hashbrown = { git = "https://github.com/pola-rs/hashbrown", rev = "d76a6f81abd8f388676aff15068236a8d21c7e1a" }

# Avoids nasty bug: https://github.com/tikv/jemallocator/pull/168
tikv-jemalloc-sys = { git = "https://github.com/pola-rs/jemallocator", rev = "0d683dfb157097e2075d5e0eaf25f71f514a7552" }
