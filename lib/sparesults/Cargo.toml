# Vendored from oxigraph's sparesults 0.3.5 (https://github.com/oxigraph/oxigraph/tree/main/lib/sparesults),
# licensed MIT OR Apache-2.0. Patched in via [patch.crates-io] in the workspace Cargo.toml, so every
# crate depending on sparesults uses this copy. Maplib change: ported to quick-xml 0.41 (taken from
# upstream commits 7b37e7eb37 and 822b7c9462) to fix RUSTSEC-2026-0194 and RUSTSEC-2026-0195.
[package]
name = "sparesults"
version = "0.3.5"
authors = ["Tpt <thomas@pellissier-tanon.fr>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["SPARQL"]
repository = "https://github.com/oxigraph/oxigraph/tree/main/lib/sparesults"
description = "SPARQL query results formats parsers and serializers (vendored into maplib)"
edition = "2024"
rust-version = "1.87"

[features]
default = []
sparql-12 = ["oxrdf/rdf-12"]
async-tokio = ["dep:tokio", "quick-xml/async-tokio", "json-event-parser/async-tokio"]

[dependencies]
json-event-parser = "0.2.3"
memchr = "2.5"
oxrdf = "=0.3.5"
quick-xml = "0.41"
thiserror = ">=1.0.50, <3.0"
tokio = { version = "1.29", optional = true, features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1.29", features = ["rt", "macros"] }
