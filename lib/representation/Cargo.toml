[package]
name = "representation"
version = "0.6.10"
edition = "2021"
rust-version.workspace = true

[features]
pyo3 = ["utils/pyo3"]

[dependencies]
utils = { path = "../utils" }
file_io = { path = "../file_io" }
spargebra = { path = "../spargebra" }
disk = { path = "../disk" }
in_memory = { path = "../in_memory" }

tracing.workspace = true
oxrdf = { workspace = true, features = ["oxsdatatypes", "serde"] }
polars = { workspace = true, features = ["cum_agg", "diagonal_concat", "merge_sorted", "performant", "lazy", "dtype-full", "timezones", "polars-time", "partition_by", "strings", "parquet"] }
polars-core = { workspace = true, features = ["performant", "simd", "nightly"] }
chrono.workspace = true
chrono-tz.workspace = true
thiserror.workspace = true
pyo3 = { workspace = true, features = ["chrono-tz", "chrono"] }
oxsdatatypes.workspace = true
rayon.workspace = true
ryu.workspace = true
nohash-hasher.workspace = true
uuid.workspace = true
polars-arrow.workspace = true
arrow = { workspace = true, features = ["ffi", "ipc"] }
# zstd compressed Arrow results of the maplib endpoints. zstd is already used by polars.
arrow-ipc = { version = "58.4.1", features = ["zstd"] }
memchr.workspace = true
rust_decimal.workspace = true
range-set-blaze.workspace = true
serde.workspace = true
serde_json.workspace = true
sparesults.workspace = true
oxttl.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs", "rdf-star"))'] }
