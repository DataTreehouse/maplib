# Vendored from oxigraph's oxttl 0.2.5 (https://github.com/oxigraph/oxigraph/tree/main/lib/oxttl),
# licensed MIT OR Apache-2.0. Patched in via [patch.crates-io] in the workspace Cargo.toml, so oxrdfio
# uses this copy too. Holds the N-Triples, N-Quads, Turtle, TriG and N3 parsers and serializers.
[package]
name = "oxttl"
version = "0.2.5"
authors = ["Tpt <thomas@pellissier-tanon.fr>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["N-Triples", "N-Quads", "Turtle", "TriG", "N3"]
repository = "https://github.com/oxigraph/oxigraph/tree/master/lib/oxttl"
description = "Parser and serializer for languages related to RDF Turtle (vendored into maplib)"
edition = "2024"
rust-version = "1.87"

[features]
default = []
rdf-12 = ["oxrdf/rdf-12"]
async-tokio = ["dep:tokio"]

[dependencies]
memchr = "2.5"
oxrdf = "=0.3.5"
oxiri = "0.2.11"
oxilangtag = "0.1"
thiserror = ">=1.0.50, <3.0"
tokio = { version = "1.29", optional = true, features = ["io-util"] }
