[package]
name = "utils"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
pyo3 = ["dep:pyo3"]

[dependencies]
polars = { workspace = true, features = ["lazy"] }
thiserror.workspace = true
polars-config.workspace = true
polars-ooc.workspace = true
