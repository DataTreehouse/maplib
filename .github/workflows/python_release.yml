# Adapted from https://github.com/pola-rs/polars/blob/main/.github/workflows/release-python.yml
# With license found in maplib/licensing/polars_LICENSE

name: Release Python

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Publishes the wheels of an existing release tag again, e.g. one that failed; uploads skip the
  # files PyPI already has.
  workflow_dispatch:
    inputs:
      ref:
        description: The release tag to build, e.g. v0.24.0
        required: true
      only_aarch64:
        description: Build only the manylinux aarch64 wheel
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2026-09-01
  MATURIN_VERSION: '1.16.0'
  MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
  PYTHON_VERSION: '3.10'

jobs:
  security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions-rs/audit-check@v1.2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}


  # One abi3 wheel per platform covers every supported Python version, so the matrix is over
  # platforms only.
  wheels:
    name: Wheel ${{ matrix.name }}
    needs: security_audit
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          # The linux jobs also publish the sdist.
          - name: manylinux x86-64
            os: ubuntu-latest
            manylinux: '2_28'
            env: |
              RUSTFLAGS=-C target-feature=+fxsr,+sse,+sse2,+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+avx,+fma
          # Fat LTO with one codegen unit runs the cross-compiling runner out of memory (rustc is
          # killed) since v0.24.0, so this wheel links with thin LTO.
          - name: manylinux aarch64
            os: ubuntu-latest
            manylinux: '2_28'
            args: --target aarch64-unknown-linux-gnu
            env: |
              CARGO_PROFILE_RELEASE_LTO=thin
              CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16
          - name: windows x86-64
            os: windows-latest
            args: --no-sdist
            env: |
              RUSTFLAGS=-C target-feature=+fxsr,+sse,+sse2,+sse3,+sse4.1,+sse4.2
          - name: mac aarch64
            os: macos-latest
            args: --no-sdist
          - name: mac x86-64
            os: macos-latest
            args: --no-sdist --target x86_64-apple-darwin
            env: |
              RUSTFLAGS=-C target-feature=+sse3,+ssse3,+sse4.1,+sse4.2,+popcnt,+cmpxchg16b,+avx,+avx2,+fma,+bmi1,+bmi2,+lzcnt,+pclmulqdq,+movbe
    env:
      # A job-level `if` cannot read the matrix, so the steps of the wheels left out of a manual
      # aarch64-only run are skipped instead.
      BUILD: ${{ !inputs.only_aarch64 || matrix.name == 'manylinux aarch64' }}
    steps:
      - uses: actions/checkout@v4
        if: env.BUILD == 'true'
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v4
        if: env.BUILD == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Fix README symlink
        if: env.BUILD == 'true'
        shell: bash
        run: |
          rm py_maplib/README.md
          cp README.md py_maplib/README.md

      - name: Set the build environment of the target
        if: env.BUILD == 'true' && matrix.env
        shell: bash
        env:
          TARGET_ENV: ${{ matrix.env }}
        run: printf '%s' "$TARGET_ENV" >> "$GITHUB_ENV"

      - name: Publish wheel
        if: env.BUILD == 'true'
        uses: PyO3/maturin-action@v1
        with:
          command: publish
          args: -m py_maplib/Cargo.toml --skip-existing -o wheels -u magbak --features abi3 ${{ matrix.args }}
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          manylinux: ${{ matrix.manylinux }}
