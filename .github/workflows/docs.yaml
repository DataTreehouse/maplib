# The documentation site, https://datatreehouse.github.io/maplib/
#
# Sphinx builds the site from the Markdown guides (README.md, API_USAGE.md, CHANGES.md, CONFIG_GRAPH.md,
# docs/release_summary.md) and from the type stubs in py_maplib/maplib, which sphinx-autoapi reads without
# building maplib. The configuration is docs/site/conf.py.
#
# Pull requests that touch the docs or the stubs build the site with warnings as errors and attach it as an
# artifact. Pushes to main and v* release tags build it and publish it to GitHub Pages.
name: website

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'py_maplib/maplib/**'
      - 'py_maplib/Cargo.toml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

# security: restrict permissions for CI jobs.
permissions:
  contents: read

# One publish at a time; a newer push replaces a queued one, a running one finishes.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build the site and upload it: as the Pages artifact when it will be published, otherwise as a
  # downloadable artifact for review.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/site/requirements.txt

      - name: Install Sphinx
        run: pip install -r docs/site/requirements.txt

      - name: Build the site
        run: sphinx-build -W --keep-going -b html docs/site docs/site/_build/html

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/_build/html

      - name: Upload the site for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website
          path: docs/site/_build/html
          retention-days: 7

  # Deploy the artifact to GitHub Pages.
  # This is a separate job so that only actions/deploy-pages has the necessary permissions.
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
