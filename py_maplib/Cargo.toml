[package]
name = "py_maplib"
version = "0.27.0"
edition.workspace = true

[features]
abi3 = ["pyo3/abi3-py310"]

[dependencies]
serde_json.workspace = true
maplib = { path = "../lib/maplib", features = ["pyo3"] }
triplestore = { path = "../lib/triplestore", features = ["pyo3"] }
csvw = { path = "../lib/csvw" }
r2rml = { path = "../lib/r2rml" }
representation = { path = "../lib/representation" }
file_io = { path = "../lib/file_io" }
templates = { path = "../lib/templates" }
shacl = { path = "../lib/shacl", features = ["pyo3"] }
cimxml_export = { path = "../lib/cimxml_export", features = ["pyo3"] }
datalog = { path = "../lib/datalog" }
virtualized_query = { path = "../lib/virtualized_query" }
virtualization = { path = "../lib/virtualization" }
external_sparql = { path = "../lib/external_sparql" }
opc_ua = { path = "../lib/opc_ua" }
cdf = { path = "../lib/cdf" }
fabric = { path = "../lib/fabric" }
spargebra = { path = "../lib/spargebra" }
server = { path = "../lib/server" }
outbound = { path = "../lib/outbound" }

pyo3.workspace = true
oxrdf.workspace = true
oxrdfio.workspace = true
thiserror.workspace = true
polars = { workspace = true, features = [
    "simd", "nightly", "performant", "cse",
    "dtype-array", "dtype-date",
    "dtype-datetime", "dtype-decimal", "dtype-duration",
    "dtype-i8", "dtype-i16", "dtype-struct",
    "dtype-time", "dtype-u8", "dtype-u16"] }
uuid.workspace = true
chrono.workspace = true
bytes.workspace = true
object_store.workspace = true

tracing.workspace = true
tracing-subscriber.workspace = true

# The global allocator. It wraps jemalloc on Unix and mimalloc elsewhere, and counts the bytes
# allocated so that the Polars streaming engine can spill to disk when over its memory budget.
polars-ooc = { workspace = true, features = ["fast_alloc"] }
utils = { path = "../lib/utils" }

[lib]
name = "maplib"
crate-type = ["cdylib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("gil-refs", "rdf-star"))'] }
