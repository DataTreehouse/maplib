<path d="M310,58H346" stroke="#444" marker-end="url(#a)"/>
<text x="600" y="62" font-size="11">partition_point with</text><text x="600" y="76" font-size="11">cmp_codes (prefix+suffix,</text><text x="600" y="90" font-size="11">no decode): log₂ n steps,</text><text x="600" y="104" font-size="11">then the run of equal codes</text>
<rect x="350" y="150" width="390" height="120" rx="6" fill="#f8f8f8" stroke="#aaa"/>
<text x="360" y="170" font-weight="bold">Same probe, other storage</text>
<text x="360" y="190">object bound + object sort: same search on osort</text>
<text x="360" y="208">object bound, no object sort: scan u32 objects (seed only)</text>
<text x="360" y="226">hybrid (dict on disk): sparse-index seek with decoded string,</text>
<text x="372" y="242">then window ≤ 200 rows compared by code</text>
<text x="360" y="260">disk: + read only the row groups of the ranges, batched per step</text>
